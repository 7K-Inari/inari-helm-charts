name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0
        with:
          version: v3.12.0

      - name: Set up helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.2

      - name: Shellcheck scripts
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh scripts/lib/*.sh
          bash -n scripts/*.sh scripts/lib/*.sh

      - name: Build dependencies
        run: helm dependency build charts/inari-platform

      - name: helm lint
        run: helm lint charts/inari-platform

      - name: helm unittest
        run: helm unittest charts/inari-platform

      - name: chart-testing lint
        run: ct lint --config ct.yaml

  install-test:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0

      - name: Install chart and wait for readiness
        run: |
          helm dependency build charts/inari-platform
          if ! helm upgrade --install inari charts/inari-platform \
            --namespace inari --create-namespace \
            --values charts/inari-platform/values-dev.yaml \
            --wait --timeout 15m; then
            kubectl -n inari get pods -o wide
            kubectl -n inari get cluster.postgresql.cnpg.io || true
            kubectl -n inari get jobs
            for p in $(kubectl -n inari get pods -o jsonpath='{.items[*].metadata.name}'); do
              echo "=== describe $p ==="; kubectl -n inari describe pod "$p" | tail -30
              echo "=== logs $p ==="; kubectl -n inari logs "$p" --all-containers --tail=50 || true
            done
            exit 1
          fi
          kubectl -n inari get pods

      - name: Smoke check
        run: |
          kubectl -n inari rollout status deployment/openfga --timeout=300s
          kubectl -n inari run smoke --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 --quiet -- \
            -fsS --retry 30 --retry-delay 5 --retry-all-errors \
            http://keycloak/realms/inari

  backup-restore-test:
    runs-on: ubuntu-latest
    needs: install-test
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Install GNU jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Create kind cluster and bootstrap
        uses: helm/kind-action@v1.12.0

      - name: Bootstrap platform stack
        run: KIND_CLUSTER_NAME=chart-testing ./scripts/bootstrap.sh --skip-kind

      - name: Backup
        run: scripts/backup.sh "$RUNNER_TEMP/backups"

      - name: DR drill (restore + verify on a fresh kind cluster)
        run: scripts/dr-drill.sh "$RUNNER_TEMP"/backups/inari-backup-*.tgz
