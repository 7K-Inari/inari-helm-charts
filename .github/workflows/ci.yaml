name: ci

on:
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read
  # ArgoCD pulls the inari-* OCI charts from ghcr.io during bootstrap.
  packages: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the shared prerequisites (kind cluster + private operator image)
  # concurrently with lint-test so bootstrap never waits on lint.
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      # The operator image package is private; anonymous pulls in kind fail.
      # Pre-pull with GITHUB_TOKEN and side-load it (pullPolicy IfNotPresent).
      - name: Preload private operator image into kind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/preload-operator-image.sh chart-testing

      # The image can't cross job runners directly; export it as an artifact
      # for install-test to load into its own kind cluster.
      # NB: save by repository reference — `docker save <image-id>` strips
      # repo:tag metadata, and the loaded image would be untagged.
      - name: Export preloaded operator image
        run: |
          docker images ghcr.io/7k-inari/inari-operator -q | grep -q .
          docker save ghcr.io/7k-inari/inari-operator -o "$RUNNER_TEMP/operator-image.tar"

      - name: Upload operator image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-image
          path: ${{ runner.temp }}/operator-image.tar
          retention-days: 1

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.22.0

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Set up chart-testing
        # v2.8.0: fixes sigstore/cosign-installer v3.8.1 (pinned inside v2.7.0)
        # failing with "Unable to validate cosign version: 'v2.4.1'".
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: v3.14.0

      - name: Set up helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.2

      - name: Shellcheck scripts
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh scripts/lib/*.sh
          bash -n scripts/*.sh scripts/lib/*.sh

      - name: helm lint
        run: |
          helm lint charts/inari-platform
          # inari-server has subchart deps (redis, nats) that must resolve first
          helm dependency build charts/inari-server
          helm lint charts/inari-server
          helm lint charts/inari-console

      - name: helm unittest
        run: helm unittest charts/inari-platform charts/inari-server charts/inari-console

      - name: chart-testing lint
        run: ct lint --config ct.yaml

      - name: Validate gitops manifests
        run: |
          # kustomize overlay must build (pulls the upstream keycloak-operator
          # manifests and applies the cluster-wide patch)
          kubectl kustomize gitops/operators/keycloak-operator > /dev/null
          # every Application points at a declared sync wave
          for f in gitops/operators/*.yaml gitops/platform/*.yaml gitops/apps/*.yaml; do
            grep -q 'argocd.argoproj.io/sync-wave' "$f" || { echo "$f: missing sync-wave annotation"; exit 1; }
          done

  install-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [prep, lint-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download operator image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: operator-image
          path: ${{ runner.temp }}

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      - name: Load preloaded operator image into kind
        run: |
          docker load -i "$RUNNER_TEMP/operator-image.tar"
          # Pick the appVersion tag (not ':latest', which only exists as a
          # workaround in preload-operator-image.sh); the chart references it.
          IMAGE_TAG=$(docker images ghcr.io/7k-inari/inari-operator --format '{{.Tag}}' | grep -v '^latest$' | head -1)
          test -n "$IMAGE_TAG"
          kind load docker-image "ghcr.io/7k-inari/inari-operator:${IMAGE_TAG}" --name chart-testing

      - name: Install GNU jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Bootstrap platform stack (ArgoCD + gitops apps)
        env:
          GITOPS_TARGET_REVISION: ${{ github.head_ref || github.ref_name }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! KIND_CLUSTER_NAME=chart-testing ./scripts/bootstrap.sh --skip-kind; then
            kubectl -n argocd get applications || true
            for a in $(kubectl -n argocd get applications -o jsonpath='{.items[*].metadata.name}'); do
              echo "=== application $a operationState ==="
              kubectl -n argocd get application "$a" -o jsonpath='{.status.operationState.message}{"\n"}{.status.sync.status}{"\n"}{.status.health.status}{"\n"}' || true
              kubectl -n argocd get application "$a" -o jsonpath='{range .status.conditions[*]}{.type}: {.message}{"\n"}{end}' || true
              kubectl -n argocd get application "$a" -o jsonpath='{range .status.resources[?(@.status!="Synced")]}{.kind}/{.name}: {.status} {.health.status}{"\n"}{end}' || true
            done
            kubectl get pods -A | grep -v -E "Running|Completed" || true
            kubectl -n cnpg-system get pods -o wide || true
            kubectl -n cnpg-system logs -l app.kubernetes.io/instance=cnpg --all-containers --tail=50 || true
            kubectl -n cnpg-system describe pods | tail -60 || true
            kubectl -n inari get pods -o wide || true
            kubectl -n inari get cluster.postgresql.cnpg.io || true
            kubectl -n inari get jobs || true
            for p in $(kubectl -n inari get pods -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              echo "=== describe $p ==="; kubectl -n inari describe pod "$p" | tail -30
              echo "=== logs $p ==="; kubectl -n inari logs "$p" --all-containers --tail=50 || true
            done
            exit 1
          fi
          kubectl -n inari get pods

      - name: Smoke check
        run: |
          kubectl -n inari rollout status deployment/openfga --timeout=300s
          kubectl -n inari run smoke --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 --quiet -- \
            -fsS --retry 30 --retry-delay 5 --retry-all-errors \
            http://keycloak-service:8080/realms/inari

      - name: Re-sync idempotency check (PostSync hooks must be rerunnable)
        run: |
          kubectl -n argocd patch application platform-config \
            --type merge -p '{"operation":{"sync":{}}}'
          sleep 10
          kubectl -n argocd wait application/platform-config \
            --for=jsonpath='{.status.health.status}'=Healthy --timeout=600s

      - name: Backup
        run: scripts/backup.sh "$RUNNER_TEMP/backups"

      - name: DR drill (restore + verify on a fresh kind cluster)
        env:
          GITOPS_TARGET_REVISION: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! scripts/dr-drill.sh "$RUNNER_TEMP"/backups/inari-backup-*.tgz; then
            kubectl -n inari get pods -o wide || true
            for p in $(kubectl -n inari get pods -o jsonpath='{.items[*].metadata.name}'); do
              echo "=== logs $p ==="; kubectl -n inari logs "$p" --all-containers --tail=50 || true
            done
            exit 1
          fi
