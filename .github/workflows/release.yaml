name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Verify tag matches chart version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CHART_VERSION="$(grep '^version:' charts/inari-platform/Chart.yaml | awk '{print $2}')"
          if [ "$TAG" != "$CHART_VERSION" ]; then
            echo "::error::tag v$TAG does not match chart version $CHART_VERSION"
            exit 1
          fi

      - name: Package chart
        run: |
          helm dependency build charts/inari-platform
          mkdir -p dist
          helm package charts/inari-platform -d dist

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart as OCI artifact
        run: helm push dist/inari-platform-*.tgz oci://ghcr.io/7k-inari/charts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
