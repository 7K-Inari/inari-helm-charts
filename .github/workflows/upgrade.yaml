name: upgrade

# Migration drill on kind: installs the platform-config chart with helm (git
# path), seeds marker data, then migrates to the gitops-composed stack
# (ArgoCD Applications from this PR) and asserts the stack is healthy and the
# data survived.
#
# Path: platform-config is installed with dataProtection.keepOnUninstall=true
# so `helm uninstall` leaves the CNPG Cluster + PVCs in place (resource-policy:
# keep). ArgoCD then adopts the surviving Cluster (apply semantics) while
# platform-config recreates the db secrets (same dev passwords).

on:
  pull_request:

permissions:
  contents: read
  # ArgoCD pulls the inari-* OCI charts from ghcr.io during bootstrap.
  packages: read

jobs:
  umbrella-to-gitops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Install GNU jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: chart-upgrade
          wait: 60s

      # The operator image package is private; anonymous pulls in kind fail.
      # Pre-pull with GITHUB_TOKEN and side-load it (pullPolicy IfNotPresent).
      - name: Preload private operator image into kind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/preload-operator-image.sh chart-upgrade

      # platform-config never installs operators; the gitops stack gets them
      # from ArgoCD Applications, the helm path needs them up front.
      - name: Install prerequisite operators
        run: ./scripts/install-operators.sh

      - name: Install platform-config with helm (git path)
        run: |
          helm upgrade --install platform-config ./charts/platform-config \
            --namespace inari --create-namespace \
            --wait --timeout 15m \
            --set postgresql.storageSize=1Gi \
            --set keycloak.hostname.hostname=http://keycloak.local:8080 \
            --set keycloak.resources.requests.cpu=100m \
            --set keycloak.resources.requests.memory=256Mi \
            --set dataProtection.keepOnUninstall=true

      # The chart only creates CRs (CNPG Cluster, Keycloak CR); helm --wait
      # returns immediately. Wait until the operator has the primary pod up.
      - name: Wait for PostgreSQL to come up
        run: |
          for i in $(seq 1 60); do
            POD=$(kubectl -n inari get pod -l cnpg.io/cluster=postgresql,cnpg.io/instanceRole=primary -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$POD" ] && kubectl -n inari wait --for=condition=ready "pod/$POD" --timeout=30s 2>/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "CNPG primary pod never became ready"; kubectl -n inari get pods; exit 1

      - name: Seed marker data
        run: |
          POD=$(kubectl -n inari get pod -l cnpg.io/cluster=postgresql,cnpg.io/instanceRole=primary -o jsonpath='{.items[0].metadata.name}')
          kubectl -n inari exec -i "$POD" -c postgres -- \
            psql -U postgres -d inari -c "CREATE TABLE migration_marker (id int PRIMARY KEY); INSERT INTO migration_marker VALUES (42);"

      - name: Uninstall the helm release (CNPG cluster survives via resource-policy=keep)
        run: |
          helm uninstall platform-config --namespace inari --wait
          kubectl -n inari get cluster.postgresql.cnpg.io postgresql

      - name: Bootstrap the gitops stack onto the same cluster
        env:
          GITOPS_TARGET_REVISION: ${{ github.head_ref || github.ref_name }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: KIND_CLUSTER_NAME=chart-upgrade ./scripts/bootstrap.sh --skip-kind

      - name: Assert marker data survived the migration
        run: |
          POD=$(kubectl -n inari get pod -l cnpg.io/cluster=postgresql,cnpg.io/instanceRole=primary -o jsonpath='{.items[0].metadata.name}')
          GOT=$(kubectl -n inari exec -i "$POD" -c postgres -- \
            psql -U postgres -d inari -Atc "SELECT id FROM migration_marker")
          [ "$GOT" = "42" ] || { echo "marker data lost (got: '$GOT')"; exit 1; }

      - name: Smoke check
        run: |
          kubectl -n inari rollout status deployment/openfga --timeout=300s
          kubectl -n inari run smoke --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 --quiet -- \
            -fsS --retry 30 --retry-delay 5 --retry-all-errors \
            http://keycloak-service:8080/realms/inari

      - name: Dump on failure
        if: failure()
        run: |
          kubectl -n argocd get applications || true
          kubectl get pods -A | grep -v Running || true
