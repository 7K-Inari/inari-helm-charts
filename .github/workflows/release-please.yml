name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      # PR-only mode: maintains the Release PR (Chart.yaml bumps via
      # x-release-please-version annotations + per-chart CHANGELOGs).
      # Tags/Releases are created by release.yaml when the PR is merged.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          skip-github-release: true
