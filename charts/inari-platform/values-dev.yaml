# kind-cluster friendly overrides for `make dev-up` (consumed via
# gitops/values/platform-config-dev.yaml — keep them in sync).
# Small footprints, but persistence stays enabled so backup/restore
# and the DR drill are meaningful.
postgresql:
  instances: 1
  storageSize: 1Gi

keycloak:
  # pin the issuer to the stable dev FQDN used by the realm redirectUris
  # (requires a keycloak.local -> 127.0.0.1 hosts entry / port-forward).
  # Keycloak hostname v2 rejects bare host:port — a port requires full URL form.
  hostname:
    hostname: http://keycloak.local:8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
