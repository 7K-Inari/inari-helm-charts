# Inari platform cluster umbrella chart.
# Installs the day-0 control-plane infrastructure: PostgreSQL (CloudNativePG),
# Keycloak (realm "inari"), NATS (JetStream) and OpenFGA.
# inari-server / inari-operator ship as disabled stubs until their images exist.

global:
  # Extra labels applied to every first-party resource.
  labels: {}

# ---------------------------------------------------------------------------
# PostgreSQL — CloudNativePG operator (subchart) + first-party Cluster CR.
# The cluster name is fixed (default "postgresql") so sibling components can
# rely on stable service names: <clusterName>-rw / <clusterName>-ro.
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  operator:
    # Install the CNPG operator (subchart) + CRDs. Disable when the cluster
    # already runs a shared CNPG operator (e.g. cnpg-system).
    enabled: true
  clusterName: postgresql
  instances: 1
  storageSize: 10Gi
  storageClass: ""
  # superuser bootstrap secret created by templates/postgres/secrets.yaml
  auth:
    # When set, the chart does not create the inari-db secret; the named
    # secret must exist (e.g. synced from Vault via ESO) and carry keys:
    # inari-uri, openfga-uri, keycloak-username, keycloak-password,
    # keycloak-admin-password (bundled Keycloak admin pass).
    existingSecret: ""
    superuserPassword: inari-dev-superuser
    passwords:
      inari: inari-dev
      keycloak: inari-dev
      openfga: inari-dev
# cloudnative-pg operator subchart values (top-level key — Helm passes values
# to subcharts by chart name, not under the `postgresql` section).
# CRDs are vendored in this chart's crds/ directory so Helm installs them
# before any template (including our Cluster CR) — disable the subchart's
# copy to avoid managing them twice.
cloudnative-pg:
  crds:
    create: false
  # operator needs no CRD conversion webhook config for M0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

# Escape hatch: skip the CNPG cluster and point everything at an external DB.
# When postgresql.enabled=false, set these to your external endpoints.
externalPostgres:
  host: ""
  port: 5432

# ---------------------------------------------------------------------------
# Keycloak — official Keycloak operator (CRDs vendored in crds/, operator
# manifests in templates/keycloak/operator.yaml) reconciling a Keycloak CR
# against the CNPG cluster, plus a KeycloakRealmImport for realm "inari".
# The operator exposes Keycloak as service "keycloak-service" on port 8080.
# ---------------------------------------------------------------------------
keycloak:
  enabled: true
  # Install the Keycloak operator CRDs. Disable when reusing an existing
  # operator-managed instance (keycloak.enabled=false + external.importInto).
  crdsInstall: true
  instances: 1
  # Pin Keycloak + operator to a matched version. The operator's default
  # image (26.1.0) breaks --optimized with newer server images; setting
  # keycloak.image also renders startOptimized: false on the Keycloak CR
  # (the operator assumes custom images are already augmented).
  image: quay.io/keycloak/keycloak:26.3.2
  operatorImage: quay.io/keycloak/keycloak-operator:26.3.2
  # Issuer hostname. Set hostname to a stable FQDN so tokens are issued with
  # a fixed iss claim without patching the Keycloak CR by hand. Must be a
  # plain hostname (keycloak.local) or a full URL (http://keycloak.local:8080)
  # — Keycloak hostname v2 rejects bare host:port. Empty = Keycloak derives
  # it per request.
  hostname:
    hostname: ""
    strict: false
  # Console (inari-ui client) OIDC redirect URIs / web origins. The realm
  # import file is rendered through tpl, so these inject into the imported
  # realm. Defaults keep local dev working; set the public console URL in
  # real deployments.
  consoleRedirectUris:
    - "http://localhost:5173/*"
  consoleWebOrigins:
    - "http://localhost:5173"
  # Reuse an existing Keycloak instance instead of deploying one
  # (keycloak.enabled=false). importInto optionally renders the
  # KeycloakRealmImport CR against an operator-managed instance.
  external:
    # in-cluster base URL for admin/backchannel calls
    baseUrl: ""
    # public issuer base (no /realms suffix), e.g. https://auth.7kgroup.org
    issuerUrl: ""
    adminSecret:
      name: ""
      userKey: username
      passKey: password
    importInto:
      name: ""
      namespace: ""
  # admin credentials for the "admin" user (dev default; override in real installs)
  adminUser: admin
  adminPassword: admin-dev
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

# ---------------------------------------------------------------------------
# NATS — official chart, JetStream enabled (internal event bus).
# ---------------------------------------------------------------------------
nats:
  enabled: true
  fullnameOverride: nats
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          size: 10Gi

# ---------------------------------------------------------------------------
# OpenFGA — official chart, postgres datastore on the CNPG cluster.
# Toggle via openfgaEnabled (the openfga values schema rejects an `enabled` key).
# ---------------------------------------------------------------------------
openfgaEnabled: true
openfga:
  fullnameOverride: openfga
  replicaCount: 1
  datastore:
    engine: postgres
    existingSecret: inari-db
    secretKeys:
      uriKey: openfga-uri
    # run migrations as an init container instead of a Job + wait-for init
    # container — fewer moving parts, no jobs RBAC needed
    migrationType: initContainer
  playground:
    enabled: false

# ---------------------------------------------------------------------------
# First-party components — stubs until images exist (plan §5.2).
# ---------------------------------------------------------------------------
inariServer:
  enabled: false
  image:
    repository: ghcr.io/7k-inari/inari-server
    tag: "0.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  # Override when the OIDC issuer is reached under a different URL than the
  # in-cluster Keycloak service (e.g. a hostname alias for browser+cluster use).
  oidcIssuerUrl: ""
  keycloakBaseUrl: ""
  # Extra INARI_* env vars, e.g. - name: INARI_AGENT_IMAGE_TAG / value: dev
  extraEnv: []
  resources: {}

inariOperator:
  enabled: false
  image:
    repository: ghcr.io/7k-inari/inari-operator
    tag: "0.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources: {}

# ---------------------------------------------------------------------------
# Values hooks for platform apps installed later from the Inari catalog
# (cert-manager, ESO, ArgoCD, monitoring) — documented stubs only, no
# templates consume these yet (plan §5.6).
# ---------------------------------------------------------------------------
certManager:
  enabled: false
externalSecrets:
  enabled: false
argocd:
  enabled: false
monitoring:
  enabled: false
