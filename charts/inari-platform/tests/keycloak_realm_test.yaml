suite: keycloak operator, realm import
templates:
  - keycloak/operator.yaml
  - keycloak/keycloak.yaml
  - keycloak/realmimport-inari.yaml
  - keycloak/admin-secret.yaml
  - keycloak/realm-verify-job.yaml
tests:
  - it: renders the Keycloak CR wired to the CNPG cluster and inari-db secret
    template: keycloak/keycloak.yaml
    asserts:
      - isAPIVersion:
          of: k8s.keycloak.org/v2alpha1
      - isKind:
          of: Keycloak
      - equal:
          path: spec.db.host
          value: postgresql-rw
      - equal:
          path: spec.db.database
          value: keycloak
      - equal:
          path: spec.db.usernameSecret.name
          value: inari-db
      - equal:
          path: spec.db.passwordSecret.key
          value: keycloak-password
      - equal:
          path: spec.bootstrapAdmin.user.secret
          value: inari-keycloak-admin
  - it: pins the keycloak image and disables startOptimized for the custom image
    template: keycloak/keycloak.yaml
    asserts:
      - equal:
          path: spec.image
          value: quay.io/keycloak/keycloak:26.3.2
      - equal:
          path: spec.startOptimized
          value: false
  - it: allows overriding the keycloak image
    template: keycloak/keycloak.yaml
    set:
      keycloak.image: quay.io/keycloak/keycloak:99.0.0
    asserts:
      - equal:
          path: spec.image
          value: quay.io/keycloak/keycloak:99.0.0
  - it: renders no hostname by default with strict disabled
    template: keycloak/keycloak.yaml
    asserts:
      - notExists:
          path: spec.hostname.hostname
      - equal:
          path: spec.hostname.strict
          value: false
  - it: pins the issuer hostname when keycloak.hostname.hostname is set
    template: keycloak/keycloak.yaml
    set:
      keycloak.hostname.hostname: keycloak.local
      keycloak.hostname.strict: true
    asserts:
      - equal:
          path: spec.hostname.hostname
          value: keycloak.local
      - equal:
          path: spec.hostname.strict
          value: true
  - it: quotes hostname values containing a port or scheme
    # Keycloak hostname v2 requires full URL form when a port is present
    template: keycloak/keycloak.yaml
    set:
      keycloak.hostname.hostname: http://keycloak.local:8080
    asserts:
      - equal:
          path: spec.hostname.hostname
          value: http://keycloak.local:8080
  - it: pins the operator deployment and related keycloak image
    template: keycloak/operator.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/keycloak/keycloak-operator:26.3.2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RELATED_IMAGE_KEYCLOAK
            value: quay.io/keycloak/keycloak:26.3.2
  - it: allows overriding the operator image
    template: keycloak/operator.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      keycloak.operatorImage: quay.io/keycloak/keycloak-operator:99.0.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/keycloak/keycloak-operator:99.0.0
  - it: renders the KeycloakRealmImport with the inari realm
    template: keycloak/realmimport-inari.yaml
    asserts:
      - isKind:
          of: KeycloakRealmImport
      - equal:
          path: spec.keycloakCRName
          value: keycloak
      - equal:
          path: spec.realm.realm
          value: inari
      - equal:
          path: spec.realm.organizationsEnabled
          value: true
  - it: includes the basic scope so tokens carry a sub claim
    template: keycloak/realmimport-inari.yaml
    asserts:
      - contains:
          path: spec.realm.defaultDefaultClientScopes
          content: basic
      - contains:
          path: spec.realm.clients[?(@.clientId == "inari-server")].defaultClientScopes
          content: basic
      - contains:
          path: spec.realm.clients[?(@.clientId == "inari-ui")].defaultClientScopes
          content: basic
  - it: maps aud=inari-server into access tokens for both clients
    template: keycloak/realmimport-inari.yaml
    asserts:
      - contains:
          path: spec.realm.clients[?(@.clientId == "inari-server")].protocolMappers
          content:
            name: audience-inari-server
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: inari-server
              access.token.claim: "true"
              id.token.claim: "false"
              userinfo.token.claim: "false"
      - contains:
          path: spec.realm.clients[?(@.clientId == "inari-ui")].protocolMappers
          content:
            name: audience-inari-server
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: inari-server
              access.token.claim: "true"
              id.token.claim: "false"
              userinfo.token.claim: "false"
  - it: renders the operator Deployment
    template: keycloak/operator.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: keycloak-operator
  - it: renders the bootstrap admin secret with username/password keys
    template: keycloak/admin-secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.username
          value: admin
      - exists:
          path: stringData.password
  - it: renders the verify job as a post-install/post-upgrade hook targeting the keycloak service
    template: keycloak/realm-verify-job.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: http://keycloak-service:8080/realms/inari
  - it: renders nothing when keycloak is disabled
    set:
      keycloak.enabled: false
    asserts:
      - hasDocuments:
          count: 0
