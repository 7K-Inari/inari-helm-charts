suite: inari-server stub
templates:
  - inari-server/deployment.yaml
  - inari-server/service.yaml
  - inari-server/serviceaccount.yaml
tests:
  - it: renders nothing by default (images do not exist yet)
    asserts:
      - hasDocuments:
          count: 0
  - it: renders a Deployment with the configured image when enabled
    template: inari-server/deployment.yaml
    set:
      inariServer.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/7k-inari/inari-server:0.0.0
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: inari-platform
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: inari-server
  - it: sources the database uri from the inari-db secret, not a plaintext env value
    template: inari-server/deployment.yaml
    set:
      inariServer.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: INARI_DATABASE_URL
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: inari-db
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: inari-uri
  - it: passes the default platform admin role to the server
    template: inari-server/deployment.yaml
    set:
      inariServer.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_PLATFORM_ADMIN_ROLE
            value: inari-platform-admin
  - it: passes an overridden platform admin role to the server
    template: inari-server/deployment.yaml
    set:
      inariServer.enabled: true
      keycloak.adminRole: custom-admin
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_PLATFORM_ADMIN_ROLE
            value: custom-admin
  - it: renders a Service when enabled
    template: inari-server/service.yaml
    set:
      inariServer.enabled: true
    asserts:
      - isKind:
          of: Service
  - it: renders a ServiceAccount when enabled
    template: inari-server/serviceaccount.yaml
    set:
      inariServer.enabled: true
    asserts:
      - isKind:
          of: ServiceAccount
