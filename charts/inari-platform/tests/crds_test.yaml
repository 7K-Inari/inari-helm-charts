suite: vendored CRDs
set:
  crds.inariOperator.enabled: true
templates:
  - crds/inari-operator.yaml
tests:
  - it: renders the inari-operator CRDs when enabled
    asserts:
      - hasDocuments:
          count: 7
      - isKind:
          of: CustomResourceDefinition
      - documentIndex: 0
        matchRegex:
          path: metadata.name
          pattern: ^argoprojects\.platform\.inari\.io$

  - it: omits CRDs when disabled
    set:
      crds.inariOperator.enabled: false
    asserts:
      - hasDocuments:
          count: 0
