suite: postgres (CloudNativePG) cluster
templates:
  - postgres/cluster.yaml
  - postgres/secrets.yaml
tests:
  - it: renders a CNPG Cluster by default
    template: postgres/cluster.yaml
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - isAPIVersion:
          of: postgresql.cnpg.io/v1
      - isKind:
          of: Cluster
  - it: cluster uses the configured name, instances and storage
    template: postgres/cluster.yaml
    documentSelector:
      path: kind
      value: Cluster
    set:
      postgresql.clusterName: pg-main
      postgresql.instances: 3
      postgresql.storageSize: 5Gi
    asserts:
      - equal:
          path: metadata.name
          value: pg-main
      - equal:
          path: spec.instances
          value: 3
      - equal:
          path: spec.storage.size
          value: 5Gi
  - it: bootstraps the inari database and manages keycloak + openfga roles declaratively
    template: postgres/cluster.yaml
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: spec.bootstrap.initdb.database
          value: inari
      - equal:
          path: spec.bootstrap.initdb.owner
          value: inari
      - contains:
          path: spec.managed.roles
          content:
            name: keycloak
            ensure: present
            login: true
            passwordSecret:
              name: inari-db
              key: keycloak-password
      - contains:
          path: spec.managed.roles
          content:
            name: openfga
            ensure: present
            login: true
            passwordSecret:
              name: inari-db
              key: openfga-password
      - notExists:
          path: spec.bootstrap.initdb.postInitApplicationSQL
  - it: renders Database CRs for keycloak and openfga
    template: postgres/cluster.yaml
    documentSelector:
      path: metadata.name
      value: postgresql-openfga
    asserts:
      - isKind:
          of: Database
      - equal:
          path: spec.name
          value: openfga
      - equal:
          path: spec.owner
          value: openfga
  - it: renders the keycloak Database CR
    template: postgres/cluster.yaml
    documentSelector:
      path: metadata.name
      value: postgresql-keycloak
    asserts:
      - isKind:
          of: Database
      - equal:
          path: spec.name
          value: keycloak
      - equal:
          path: spec.owner
          value: keycloak
  - it: skips the keycloak role and database when using an external Keycloak
    template: postgres/cluster.yaml
    documentSelector:
      path: kind
      value: Cluster
    set:
      keycloak.enabled: false
      keycloak.external.baseUrl: http://keycloak-service.keycloak.svc:8080
      keycloak.external.issuerUrl: https://auth.example.org
      keycloak.external.adminSecret.name: inari-keycloak-admin
    asserts:
      - notContains:
          path: spec.managed.roles
          content:
            name: keycloak
  - it: renders the app secret with per-database passwords and the openfga datastore uri
    template: postgres/secrets.yaml
    set:
      postgresql.auth.passwords.keycloak: kc-secret
      postgresql.auth.passwords.openfga: fga-secret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.keycloak-password
          value: kc-secret
      - matchRegex:
          path: stringData.openfga-uri
          pattern: "postgres://openfga:fga-secret@postgresql-rw:5432/openfga" 
  - it: renders the inari database uri for the inari-server deployment
    template: postgres/secrets.yaml
    set:
      postgresql.auth.passwords.inari: inari-secret
    asserts:
      - matchRegex:
          path: stringData.inari-uri
          pattern: "postgres://inari:inari-secret@postgresql-rw:5432/inari"
  - it: renders nothing when postgresql is disabled
    asserts:
      - hasDocuments:
          count: 0
    set:
      postgresql.enabled: false
