suite: gateway api httproutes (no ingress, no gateway CR)
templates:
  - keycloak/httproute.yaml
  - keycloak/keycloak.yaml
  - inari-server/httproute.yaml
tests:
  - it: renders no keycloak httproute by default
    template: keycloak/httproute.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no inari-server httproute by default
    template: inari-server/httproute.yaml
    set:
      inariServer.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the keycloak httproute against the existing gateway
    template: keycloak/httproute.yaml
    set:
      gateway:
        name: main
        namespace: gateways
        sectionName: https
      keycloak:
        route:
          enabled: true
          hostnames:
            - auth.example.org
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HTTPRoute
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: inari-platform
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: keycloak
      - equal:
          path: spec.parentRefs[0].name
          value: main
      - equal:
          path: spec.parentRefs[0].namespace
          value: gateways
      - equal:
          path: spec.parentRefs[0].sectionName
          value: https
      - equal:
          path: spec.hostnames
          value: ["auth.example.org"]
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: keycloak-service
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8080

  - it: omits namespace, sectionName and hostnames when empty
    template: keycloak/httproute.yaml
    set:
      gateway.name: main
      keycloak.route.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: spec.parentRefs[0].namespace
      - notExists:
          path: spec.parentRefs[0].sectionName
      - notExists:
          path: spec.hostnames

  - it: fails when a route is enabled without gateway.name
    template: keycloak/httproute.yaml
    set:
      keycloak.route.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: gateway.name is required when a route is enabled — the chart does not create a Gateway; point gateway.name at the Gateway you have already deployed

  - it: disables the keycloak operator ingress
    template: keycloak/keycloak.yaml
    asserts:
      - equal:
          path: spec.ingress.enabled
          value: false

  - it: renders the inari-server httproute
    template: inari-server/httproute.yaml
    set:
      gateway.name: main
      inariServer.enabled: true
      inariServer.route:
        enabled: true
        hostnames:
          - api.example.org
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: inari-server
      - equal:
          path: spec.parentRefs[0].name
          value: main
      - equal:
          path: spec.hostnames
          value: ["api.example.org"]
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8080

  - it: renders only httproutes, no ingress or gateway resources
    template: keycloak/httproute.yaml
    set:
      gateway.name: main
      keycloak.route.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HTTPRoute

  - it: renders only httproutes, no ingress or gateway resources (inari-server)
    template: inari-server/httproute.yaml
    set:
      gateway.name: main
      inariServer.enabled: true
      inariServer.route.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HTTPRoute
