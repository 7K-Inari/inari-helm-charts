{{- if .Values.keycloak.enabled }}
# Bootstrap admin for the Keycloak operator (requires literal
# 'username'/'password' keys — cannot share the inari-db secret).
apiVersion: v1
kind: Secret
metadata:
  name: inari-keycloak-admin
  labels:
    {{- include "inari-platform.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.keycloak.adminUser | quote }}
  password: {{ .Values.keycloak.adminPassword | quote }}
{{- end }}
