{{- if .Values.keycloak.enabled }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: inari-realm-inari
  labels:
    {{- include "inari-platform.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
spec:
  keycloakCRName: keycloak
  realm:
    {{- tpl (.Files.Get "files/realm-inari.json") . | fromJson | toYaml | nindent 4 }}
{{- end }}
