{{- if .Values.keycloak.enabled }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  labels:
    {{- include "inari-platform.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
spec:
  instances: {{ .Values.keycloak.instances }}
  bootstrapAdmin:
    user:
      # secret with literal 'username'/'password' keys (operator contract)
      secret: inari-keycloak-admin
  db:
    vendor: postgres
    host: {{ include "inari-platform.postgresHost" . }}
    port: {{ include "inari-platform.postgresPort" . }}
    database: keycloak
    usernameSecret:
      name: inari-db
      key: keycloak-username
    passwordSecret:
      name: inari-db
      key: keycloak-password
  http:
    httpEnabled: true
  hostname:
    strict: false
  {{- with .Values.keycloak.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
