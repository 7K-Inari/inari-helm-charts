{{- if .Values.keycloak.enabled }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  labels:
    {{- include "inari-platform.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
spec:
  instances: {{ .Values.keycloak.instances }}
  {{- if .Values.keycloak.image }}
  image: {{ .Values.keycloak.image }}
  # the operator assumes custom images are already augmented (--optimized);
  # the pinned stock image is not, so keep the normal build path
  startOptimized: false
  {{- end }}
  bootstrapAdmin:
    user:
      # secret with literal 'username'/'password' keys (operator contract)
      secret: inari-keycloak-admin
  db:
    vendor: postgres
    host: {{ include "inari-platform.postgresHost" . }}
    port: {{ include "inari-platform.postgresPort" . }}
    database: keycloak
    usernameSecret:
      name: inari-db
      key: keycloak-username
    passwordSecret:
      name: inari-db
      key: keycloak-password
  http:
    httpEnabled: true
  hostname:
    {{- with .Values.keycloak.hostname.hostname }}
    hostname: {{ . }}
    {{- end }}
    strict: {{ .Values.keycloak.hostname.strict }}
  {{- with .Values.keycloak.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
