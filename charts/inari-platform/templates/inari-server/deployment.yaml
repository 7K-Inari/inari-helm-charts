{{- if .Values.inariServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inari-platform.fullname" . }}-server
  labels:
    {{- include "inari-platform.componentLabels" (dict "root" . "component" "inari-server") | nindent 4 }}
spec:
  replicas: {{ .Values.inariServer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: inari-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "inari-platform.componentLabels" (dict "root" . "component" "inari-server") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "inari-platform.fullname" . }}-server
      containers:
        - name: server
          image: "{{ .Values.inariServer.image.repository }}:{{ .Values.inariServer.image.tag }}"
          imagePullPolicy: {{ .Values.inariServer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.inariServer.service.port }}
          env:
            - name: INARI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "inari-platform.dbSecretName" . }}
                  key: inari-uri
            - name: INARI_OPENFGA_API_URL
              value: http://openfga:8080
            - name: INARI_OIDC_ISSUER_URL
              value: {{ include "inari-platform.oidcIssuerUrl" . | quote }}
            - name: INARI_KEYCLOAK_BASE_URL
              value: {{ include "inari-platform.keycloakBaseUrl" . | quote }}
            - name: INARI_KEYCLOAK_REALM
              value: "inari"
            - name: INARI_KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "inari-platform.keycloakAdminSecretName" . }}
                  key: {{ include "inari-platform.keycloakAdminClientIdKey" . }}
            - name: INARI_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "inari-platform.keycloakAdminSecretName" . }}
                  key: {{ include "inari-platform.keycloakAdminClientSecretKey" . }}
            {{- with .Values.inariServer.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.inariServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
