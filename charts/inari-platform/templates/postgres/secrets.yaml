{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: inari-db
  labels:
    {{- include "inari-platform.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
type: Opaque
stringData:
  # keys consumed by the CNPG initdb bootstrap secret contract
  username: inari
  password: {{ .Values.postgresql.auth.passwords.inari | quote }}
  postgres-password: {{ .Values.postgresql.auth.superuserPassword | quote }}
  inari-password: {{ .Values.postgresql.auth.passwords.inari | quote }}
  inari-uri: {{ printf "postgres://inari:%s@%s:%s/inari?sslmode=disable"
      .Values.postgresql.auth.passwords.inari
      (include "inari-platform.postgresHost" .)
      (include "inari-platform.postgresPort" .) | quote }}
  keycloak-password: {{ .Values.postgresql.auth.passwords.keycloak | quote }}
  keycloak-username: keycloak
  keycloak-admin-password: {{ .Values.keycloak.adminPassword | quote }}
  openfga-password: {{ .Values.postgresql.auth.passwords.openfga | quote }}
  openfga-uri: {{ printf "postgres://openfga:%s@%s:%s/openfga?sslmode=disable"
      .Values.postgresql.auth.passwords.openfga
      (include "inari-platform.postgresHost" .)
      (include "inari-platform.postgresPort" .) | quote }}
---
# Per-role basic-auth secrets for CNPG spec.managed.roles passwordSecret
# (CNPG requires one basic-auth secret per role: username must match the role).
{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inari-platform.roleSecretName" (dict "root" . "role" "keycloak") }}
  labels:
    {{- include "inari-platform.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: keycloak
  password: {{ .Values.postgresql.auth.passwords.keycloak | quote }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inari-platform.roleSecretName" (dict "root" . "role" "openfga") }}
  labels:
    {{- include "inari-platform.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: openfga
  password: {{ .Values.postgresql.auth.passwords.openfga | quote }}
{{- end }}
