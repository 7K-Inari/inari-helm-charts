{{- if .Values.postgresql.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgresql.clusterName }}
  labels:
    {{- include "inari-platform.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  instances: {{ .Values.postgresql.instances }}
  {{- if .Values.postgresql.storageClass }}
  storage:
    storageClass: {{ .Values.postgresql.storageClass }}
    size: {{ .Values.postgresql.storageSize }}
  {{- else }}
  storage:
    size: {{ .Values.postgresql.storageSize }}
  {{- end }}
  bootstrap:
    initdb:
      database: inari
      owner: inari
      secret:
        name: inari-db
      postInitApplicationSQL:
        - CREATE ROLE keycloak LOGIN PASSWORD {{ .Values.postgresql.auth.passwords.keycloak | quote }}
        - CREATE DATABASE keycloak OWNER keycloak
        - CREATE ROLE openfga LOGIN PASSWORD {{ .Values.postgresql.auth.passwords.openfga | quote }}
        - CREATE DATABASE openfga OWNER openfga
{{- end }}
