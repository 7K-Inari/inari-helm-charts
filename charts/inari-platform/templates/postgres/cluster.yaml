{{- if .Values.postgresql.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgresql.clusterName }}
  {{- if .Values.dataProtection.keepOnUninstall }}
  annotations:
    # Survive ArgoCD prune / helm uninstall — the database and its PVCs stay.
    "argocd.argoproj.io/sync-options": Prune=false
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    {{- include "platform-config.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  instances: {{ .Values.postgresql.instances }}
  {{- if .Values.postgresql.storageClass }}
  storage:
    storageClass: {{ .Values.postgresql.storageClass }}
    size: {{ .Values.postgresql.storageSize }}
  {{- else }}
  storage:
    size: {{ .Values.postgresql.storageSize }}
  {{- end }}
  bootstrap:
    initdb:
      database: inari
      owner: inari
      secret:
        name: {{ include "platform-config.dbSecretName" . }}
  # Declarative role management: passwords live in the db secret and stay in
  # sync on rotation/upgrade (no one-shot postInit drift). Database objects
  # are separate Database CRs below.
  managed:
    roles:
      {{- if .Values.keycloak.enabled }}
      - name: keycloak
        ensure: present
        login: true
        # CNPG passwordSecret is name-only; the secret must be of type
        # kubernetes.io/basic-auth with matching username/password keys.
        passwordSecret:
          name: {{ include "platform-config.roleSecretName" (dict "root" . "role" "keycloak") }}
      {{- end }}
      - name: openfga
        ensure: present
        login: true
        passwordSecret:
          name: {{ include "platform-config.roleSecretName" (dict "root" . "role" "openfga") }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .Values.postgresql.clusterName }}-openfga
  labels:
    {{- include "platform-config.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  cluster:
    name: {{ .Values.postgresql.clusterName }}
  name: openfga
  owner: openfga
---
{{- if .Values.keycloak.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .Values.postgresql.clusterName }}-keycloak
  labels:
    {{- include "platform-config.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  cluster:
    name: {{ .Values.postgresql.clusterName }}
  name: keycloak
  owner: keycloak
{{- end }}
{{- end }}
