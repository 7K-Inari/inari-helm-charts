{{- if .Values.postgresql.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgresql.clusterName }}
  {{- if .Values.dataProtection.keepOnUninstall }}
  annotations:
    # Survive helm uninstall / ArgoCD prune — the database and its PVCs stay.
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    {{- include "inari-platform.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  instances: {{ .Values.postgresql.instances }}
  {{- if .Values.postgresql.storageClass }}
  storage:
    storageClass: {{ .Values.postgresql.storageClass }}
    size: {{ .Values.postgresql.storageSize }}
  {{- else }}
  storage:
    size: {{ .Values.postgresql.storageSize }}
  {{- end }}
  bootstrap:
    initdb:
      database: inari
      owner: inari
      secret:
        name: {{ include "inari-platform.dbSecretName" . }}
      postInitApplicationSQL:
        {{- if .Values.keycloak.enabled }}
        - "CREATE ROLE keycloak LOGIN PASSWORD '$(keycloak-password)'"
        - CREATE DATABASE keycloak OWNER keycloak
        {{- end }}
        - "CREATE ROLE openfga LOGIN PASSWORD '$(openfga-password)'"
        - CREATE DATABASE openfga OWNER openfga
{{- end }}
