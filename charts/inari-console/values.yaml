replicaCount: 1

bundle:
  # OCI artifact carrying the built console (oras layout).
  repository: ghcr.io/7k-inari/inari-ui-bundle
  tag: "1.2.0"

# Runtime config rendered into config.js (window.__INARI_CONFIG__).
keycloakUrl: "http://localhost:8080"
keycloakRealm: "inari"
keycloakClientId: "inari-ui"
apiBaseUrl: "/api/v1"

nginx:
  corsOrigins:
    - "https://example.org"
    - "https://auth.example.org"

image:
  # oras CLI used by the init container to pull the bundle
  orasRepository: ghcr.io/oras-project/oras
  orasTag: v1.3.0
  nginxRepository: nginx
  nginxTag: 1.27-alpine

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

service:
  type: ClusterIP
  port: 80

# ---------------------------------------------------------------------------
# Gateway API — parentRef to an ALREADY-EXISTING Gateway. This chart never
# creates a Gateway/GatewayClass and never installs a Gateway controller:
# a Gateway must be deployed beforehand.
# ---------------------------------------------------------------------------
gateway:
  # Name of the existing Gateway. Required when route.enabled=true.
  name: ""
  # Namespace of the Gateway. Empty = same namespace as this release.
  namespace: ""
  # Optional listener name on the Gateway to attach the route to.
  sectionName: ""

# HTTPRoute exposing the console via the Gateway referenced in `gateway:`.
route:
  enabled: false
  # e.g. ["console.example.org"]; empty = match all hostnames.
  hostnames: []
  # Optional path prefix match. When set, the route only matches requests
  # whose path starts with this value (PathPrefix). Empty = match all paths.
  pathPrefix: ""
  # Extra annotations for the HTTPRoute (e.g. external-dns/cloudflare-proxy).
  annotations: {}
