suite: HA guardrails (probes, PDB, pod spreading)
release:
  name: inari-console
templates:
  - deployment.yaml
  - pdb.yaml
tests:
  - it: default renders a liveness probe on the nginx container and keeps readiness unchanged
    templates:
      - deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http

  - it: liveness probe is overridable via values
    set:
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 5
    templates:
      - deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 5

  - it: default renders no affinity or topologySpreadConstraints
    templates:
      - deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.affinity
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: default (replicaCount 1) renders no PDB
    templates:
      - pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: pdb.enabled alone does not render a PDB below 2 replicas
    set:
      pdb:
        enabled: true
      replicaCount: 1
    templates:
      - pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: replicaCount 2 renders a PDB with minAvailable 1 and the deployment selector
    set:
      replicaCount: 2
    templates:
      - pdb.yaml
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: inari-console
            app.kubernetes.io/instance: inari-console

  - it: pdb.enabled false suppresses the PDB at 2 replicas
    set:
      replicaCount: 2
      pdb:
        enabled: false
    templates:
      - pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: pdb.minAvailable is configurable
    set:
      replicaCount: 3
      pdb:
        minAvailable: 2
    templates:
      - pdb.yaml
    asserts:
      - equal:
          path: spec.minAvailable
          value: 2

  - it: HA posture renders podAntiAffinity on hostname and topologySpreadConstraints
    set:
      replicaCount: 2
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: inari-console
                    app.kubernetes.io/instance: inari-console
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inari-console
              app.kubernetes.io/instance: inari-console
    templates:
      - deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
