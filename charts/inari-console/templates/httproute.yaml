{{- if .Values.route.enabled }}
{{- $gateway := .Values.gateway }}
{{- if not $gateway.name }}
{{- fail "gateway.name is required when a route is enabled — the chart does not create a Gateway; point gateway.name at the Gateway you have already deployed" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "inari-console.fullname" . }}
  labels:
    {{- include "inari-console.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gateway.name }}
      {{- with $gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "inari-console.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
