apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inari-console.fullname" . }}-nginx
  labels:
    {{- include "inari-console.labels" . | nindent 4 }}
data:
  default.conf: |
    map $http_origin $cors_origin {
      default "";
      "~^https?://localhost(:[0-9]+)?$" $http_origin;
      "~^https?://.*\.7kgroup\.org$" $http_origin;
      "https://auth.7kgroup.org" $http_origin;
    }
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;

      # ==========================================
      # CORS Preflight (OPTIONS) - server-wide
      # ==========================================
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' 1728000 always;
        add_header 'Content-Type' 'text/plain; charset=utf-8' always;
        add_header 'Content-Length' 0 always;
        return 204;
      }

      # ==========================================
      # Main SPA location
      # ==========================================
      location / {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        try_files $uri $uri/ /index.html;
      }

      # ==========================================
      # Config.js with no-cache + CORS
      # ==========================================
      location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        try_files $uri =404;
      }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inari-console.fullname" . }}
  labels:
    {{- include "inari-console.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "inari-console.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
