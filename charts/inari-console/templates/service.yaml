apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inari-console.fullname" . }}-nginx
  labels:
    {{- include "inari-console.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;
      # SPA fallback for react-router
      location / {
        try_files $uri $uri/ /index.html;
      }
      location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inari-console.fullname" . }}
  labels:
    {{- include "inari-console.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "inari-console.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
