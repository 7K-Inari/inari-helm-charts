{{- if .Values.keycloak.enabled }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  annotations:
    "argocd.argoproj.io/sync-wave": "1"
  name: keycloak
  labels:
    {{- include "platform-config.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
spec:
  instances: {{ .Values.keycloak.instances }}
  {{- if .Values.keycloak.image }}
  image: {{ include "platform-config.image" (dict "root" . "image" .Values.keycloak.image) | quote }}
  # the operator assumes custom images are already augmented (--optimized);
  # the pinned stock image is not, so keep the normal build path
  startOptimized: false
  {{- end }}
  {{- with .Values.global.imagePullSecrets }}
  # Escape hatch to attach pull secrets to the operator-managed Keycloak pod.
  unsupported:
    podTemplate:
      spec:
        imagePullSecrets:
          {{- range . }}
          - name: {{ . | quote }}
          {{- end }}
  {{- end }}
  # No bootstrapAdmin block: the operator auto-generates a temporary
  # bootstrap admin secret (keycloak-initial-admin). Workloads authenticate
  # via the inari-platform-admin service account instead.
  db:
    vendor: postgres
    host: {{ include "platform-config.postgresHost" . }}
    port: {{ include "platform-config.postgresPort" . }}
    database: keycloak
    usernameSecret:
      name: {{ include "platform-config.dbSecretName" . }}
      key: keycloak-username
    passwordSecret:
      name: {{ include "platform-config.dbSecretName" . }}
      key: keycloak-password
  http:
    httpEnabled: true
  # Ingress is disabled: exposure goes through the chart's HTTPRoute
  # (keycloak.route) against a pre-existing Gateway instead.
  ingress:
    enabled: false
  hostname:
    {{- with .Values.keycloak.hostname.hostname }}
    hostname: {{ . | quote }}
    {{- end }}
    strict: {{ .Values.keycloak.hostname.strict }}
  {{- with .Values.keycloak.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
