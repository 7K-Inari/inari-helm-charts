{{- if .Values.keycloak.enabled }}
# One-shot per install/upgrade: grants the inari-platform-admin service
# account the realm-management realm-admin role. Realm import cannot map
# roles onto a service account, so this closes the gap using the operator's
# temporary bootstrap admin (keycloak-initial-admin secret) — workloads
# themselves never see admin user/password credentials.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "platform-config.fullname" . }}-client-setup
  labels:
    {{- include "platform-config.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
  annotations:
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
    "argocd.argoproj.io/hook-weight": "6"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "platform-config.componentLabels" (dict "root" . "component" "keycloak") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "platform-config.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: client-setup
          image: {{ include "platform-config.image" (dict "root" . "image" .Values.keycloak.hookImage) | quote }}
          env:
            - name: KC_BASE
              value: http://keycloak-service:8080
            - name: ADMIN_CLIENT_ID
              value: {{ .Values.keycloak.adminClient.clientId | quote }}
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: username
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              json_id() { sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1; }

              for i in $(seq 1 60); do
                code=$(curl -s -o /dev/null -w '%{http_code}' "$KC_BASE/realms/inari" || true)
                [ "$code" = "200" ] && break
                echo "waiting for realm 'inari' (HTTP $code), attempt $i/60"
                sleep 5
              done
              [ "$code" = "200" ] || { echo "realm 'inari' never became reachable" >&2; exit 1; }

              TOKEN=$(curl -sS -X POST "$KC_BASE/realms/master/protocol/openid-connect/token" \
                -H 'Content-Type: application/x-www-form-urlencoded' \
                -d "grant_type=password&client_id=admin-cli&username=$KC_ADMIN_USER&password=$KC_ADMIN_PASSWORD" \
                | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
              [ -n "$TOKEN" ] || { echo "could not obtain bootstrap admin token" >&2; exit 1; }
              AUTH="Authorization: Bearer $TOKEN"

              CLIENT_UUID=$(curl -sS "$KC_BASE/admin/realms/inari/clients?clientId=$ADMIN_CLIENT_ID" -H "$AUTH" | json_id)
              [ -n "$CLIENT_UUID" ] || { echo "client '$ADMIN_CLIENT_ID' not found in realm 'inari'" >&2; exit 1; }
              SA_USER=$(curl -sS "$KC_BASE/admin/realms/inari/clients/$CLIENT_UUID/service-account-user" -H "$AUTH" | json_id)
              RM_UUID=$(curl -sS "$KC_BASE/admin/realms/inari/clients?clientId=realm-management" -H "$AUTH" | json_id)
              ROLE=$(curl -sS "$KC_BASE/admin/realms/inari/clients/$RM_UUID/roles/realm-admin" -H "$AUTH")
              echo "$ROLE" | grep -q '"name":"realm-admin"' || { echo "realm-admin role not found" >&2; exit 1; }

              code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                "$KC_BASE/admin/realms/inari/users/$SA_USER/role-mappings/clients/$RM_UUID" \
                -H "$AUTH" -H 'Content-Type: application/json' -d "[$ROLE]")
              [ "$code" = "204" ] || { echo "role assignment failed (HTTP $code)" >&2; exit 1; }
              echo "service account of client '$ADMIN_CLIENT_ID' now has realm-management/realm-admin"
{{- end }}
