# Cluster-local Dex for ONE tenant cluster. Deployed once per tenant cluster
# by the inari-operator (W3 reconcile); never shared across clusters.

global:
  # Extra labels applied to every resource.
  labels: {}

image:
  repository: ghcr.io/dexidp/dex
  # Empty = appVersion from Chart.yaml.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# Public issuer URL of this cluster's Dex, e.g.
# https://dex.cluster-abc123.example.org. Tokens minted here carry this iss.
# Required (also embedded into the dev config; production configs carry their
# own issuer inside config.existingSecret).
issuer: ""

# ---------------------------------------------------------------------------
# Dex configuration — secrets are NEVER inline in this chart. Production
# installs point config.existingSecret at a Secret synced from Vault via ESO
# carrying the full Dex config.yaml (connectors, static clients for ArgoCD and
# the cluster-<id>-dex Keycloak upstream, signing keys). config.devMode is a
# kind-only escape hatch rendering a mock-connector ConfigMap.
# ---------------------------------------------------------------------------
config:
  # Name of a pre-provisioned Secret (ESO/Vault) with the full Dex config.
  # Mutually exclusive with devMode — exactly one of the two must be set.
  existingSecret: ""
  # Key inside existingSecret holding the Dex config file.
  configKey: config.yaml
  # DEV ONLY (kind): render a ConfigMap with a mock connector (auto-approves
  # every login) and a static "argocd" client. Never enable outside dev.
  devMode: false

service:
  type: ClusterIP
  # Dex API port; stable so siblings (ArgoCD, extensions) can rely on it.
  port: 5556

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Gateway API — parentRef to an ALREADY-EXISTING Gateway (same convention as
# platform-config: this chart never creates a Gateway/GatewayClass).
# ---------------------------------------------------------------------------
gateway:
  name: ""
  namespace: ""
  sectionName: ""
route:
  enabled: false
  # e.g. ["dex.cluster-abc123.example.org"]; empty = match all hostnames.
  hostnames: []
  annotations: {}

# ---------------------------------------------------------------------------
# Network policy — default-deny posture when enabled: ingress only from the
# gateway/ingress path and in-cluster clients, egress to DNS, Keycloak and
# git/OIDC providers (443).
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: false
  # Extra ingress peers (e.g. the ingress-controller/gateway namespace). The
  # policy always allows same-namespace and kube-system DNS egress.
  extraIngressPeers: []
  # Egress CIDRs allowed on 443 (Keycloak issuer + git providers). Empty =
  # any IPv4 destination on 443.
  egressCidrs: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
