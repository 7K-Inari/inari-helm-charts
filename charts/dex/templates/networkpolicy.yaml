{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dex.fullname" . }}
  labels:
    {{- include "dex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dex.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Dex API from in-cluster clients (ArgoCD, extensions, operator) plus any
    # explicitly allowed peers (e.g. the gateway/ingress namespace).
    - from:
        - namespaceSelector: {}
        {{- with .Values.networkPolicy.extraIngressPeers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # OIDC upstreams: platform Keycloak (cluster-<id>-dex client) and git
    # social-login providers — 443 only.
    - to:
        {{- if .Values.networkPolicy.egressCidrs }}
        {{- range .Values.networkPolicy.egressCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- else }}
        - ipBlock:
            cidr: 0.0.0.0/0
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
{{- end }}
