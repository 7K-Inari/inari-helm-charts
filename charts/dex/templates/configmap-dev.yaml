{{- if .Values.config.devMode }}
# DEV ONLY (kind): mock connector that auto-approves every login, plus a
# static "argocd" client. Production installs MUST use config.existingSecret
# (ESO/Vault-synced) — connector secrets are never rendered by this chart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dex.configName" . }}
  labels:
    {{- include "dex.labels" . | nindent 4 }}
data:
  {{ .Values.config.configKey }}: |
    issuer: {{ required "issuer is required" .Values.issuer | quote }}
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
    enablePasswordDB: false
    connectors:
      - type: mockCallback
        id: mock
        name: Dev Mock Login
    staticClients:
      - id: argocd
        name: ArgoCD (dev)
        secret: inari-dev-argocd-dex
        redirectURIs:
          - http://localhost:8080/auth/callback
          - http://argocd-server.argocd.svc:8080/auth/callback
{{- end }}
