suite: dex deployment, config sources, service
templates:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
  - configmap-dev.yaml
tests:
  - it: renders the deployment pinned to the appVersion image with a mounted secret config
    template: deployment.yaml
    set:
      issuer: https://dex.cluster-abc123.example.org
      config:
        existingSecret: vault-dex-config
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/dexidp/dex:2.43.1
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["dex", "serve", "/etc/dex/config.yaml"]
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: vault-dex-config
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-dex
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
  - it: runs restricted (non-root, read-only rootfs, no privileges)
    template: deployment.yaml
    set:
      issuer: https://dex.cluster-abc123.example.org
      config:
        existingSecret: vault-dex-config
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: ["ALL"]
  - it: carries resource defaults
    template: deployment.yaml
    set:
      issuer: https://dex.cluster-abc123.example.org
      config:
        existingSecret: vault-dex-config
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 50m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 64Mi
  - it: honors a custom config key for the mounted config file
    template: deployment.yaml
    set:
      issuer: https://dex.cluster-abc123.example.org
      config:
        existingSecret: vault-dex-config
        configKey: dex.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: /etc/dex/dex.yaml
  - it: fails when neither existingSecret nor devMode is set
    template: deployment.yaml
    set:
      issuer: https://dex.cluster-abc123.example.org
    asserts:
      - failedTemplate:
          errorMessage: one of config.existingSecret (ESO/Vault-synced Secret with the full Dex config.yaml) or config.devMode (kind-only mock connector) is required
  - it: fails when existingSecret and devMode are both set
    template: deployment.yaml
    set:
      issuer: https://dex.cluster-abc123.example.org
      config:
        existingSecret: vault-dex-config
        devMode: true
    asserts:
      - failedTemplate:
          errorMessage: config.existingSecret and config.devMode are mutually exclusive — production uses existingSecret (ESO/Vault), devMode is kind-only
  - it: fails when issuer is empty
    template: deployment.yaml
    set:
      issuer: ""
      config:
        existingSecret: vault-dex-config
    asserts:
      - failedTemplate:
          errorMessage: issuer is required — the public issuer URL of this cluster's Dex (e.g. https://dex.cluster-<id>.example.org)
  - it: mounts the dev ConfigMap and renders it in devMode
    template: configmap-dev.yaml
    set:
      issuer: https://dex.cluster-abc123.example.org
      config:
        devMode: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'issuer: "https://dex\.cluster-abc123\.example\.org"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: "type: mockCallback"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "id: argocd"
  - it: renders no dev ConfigMap with existingSecret
    template: configmap-dev.yaml
    set:
      issuer: https://dex.cluster-abc123.example.org
      config:
        existingSecret: vault-dex-config
    asserts:
      - hasDocuments:
          count: 0
  - it: mounts the dev ConfigMap in the deployment in devMode
    template: deployment.yaml
    set:
      issuer: https://dex.cluster-abc123.example.org
      config:
        devMode: true
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: RELEASE-NAME-dex-config
  - it: renders the service on the stable dex port
    template: service.yaml
    set:
      issuer: https://dex.cluster-abc123.example.org
      config:
        existingSecret: vault-dex-config
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 5556
      - equal:
          path: spec.ports[0].targetPort
          value: http
  - it: disables service-account token automount
    template: serviceaccount.yaml
    set:
      issuer: https://dex.cluster-abc123.example.org
      config:
        existingSecret: vault-dex-config
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
