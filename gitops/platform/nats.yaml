# NATS (JetStream) — internal event bus. Values mirror the old umbrella
# nats: subchart section + values-dev.yaml overrides.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: inari
  source:
    repoURL: https://nats-io.github.io/k8s/helm/charts/
    chart: nats
    targetRevision: 1.3.2
    helm:
      releaseName: nats
      values: |
        fullnameOverride: nats
        config:
          jetstream:
            enabled: true
            fileStore:
              enabled: true
              pvc:
                size: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: inari
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
