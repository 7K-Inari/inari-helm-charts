# inari-operator CRDs (platform.inari.io) — released from the inari-operator
# repo (phase 1). Must sync before anything that uses these CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inari-operator-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: inari
  source:
    repoURL: ghcr.io/7k-inari/charts
    chart: inari-operator-crds
    targetRevision: 0.1.1
    helm:
      releaseName: inari-operator-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: inari
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
