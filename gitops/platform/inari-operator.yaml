# inari-operator — released from the inari-operator repo (phase 1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inari-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: inari
  source:
    repoURL: ghcr.io/7k-inari/charts  # TODO: move to ghcr.io/7k-inari/inari-operator/charts once the inari-operator repo publishes to its repo-scoped path
    chart: inari-operator
    targetRevision: 0.1.1
    helm:
      releaseName: inari-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: inari
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
