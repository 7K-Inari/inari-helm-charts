# Keycloak operator via the kustomize overlay in this repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: inari
  source:
    # TODO: flip to inari-release-bundle.git once the repo rename lands
    # (GitHub redirects git/HTTP, but ArgoCD repo entries should use the canonical name).
    repoURL: https://github.com/7K-Inari/inari-helm-charts.git
    targetRevision: HEAD
    path: gitops/operators/keycloak-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      selfHeal: true
