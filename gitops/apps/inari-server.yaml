# inari-server — OCI chart released from this repo (charts/inari-server,
# moved from the inari-server repo) into the org-level OCI namespace.
# targetRevision pins the first centrally-released chart version; stays
# OutOfSync until that release is published (bootstrap treats it as optional).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inari-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: inari
  source:
    repoURL: ghcr.io/7k-inari/charts
    chart: inari-server
    targetRevision: 0.2.0
    helm:
      releaseName: inari-server
      values: |
        # Event bus (ADR-0014): external 3-node NATS from
        # gitops/platform/nats.yaml (sync wave 1 < 3), chart subchart off.
        # NOTE: targetRevision above must point at a chart release that
        # includes NATS support before this block syncs.
        nats:
          enabled: false
          url: nats://nats:4222
          streamReplicas: 3
        gateway:
          name: internet-gateway
          namespace: istio
          sectionName: https-7kgroup
        route:
          enabled: true
          hostnames:
            - inari.7kgroup.org
          pathPrefix: /api
          # Dedicated agent-gateway hostname: PathPrefix matching is
          # segment-based and cannot express "/inari.", so agent ConnectRPC
          # gets its own hostname routed wholly to inari-server.
          agentHostnames:
            - inari-gw.7kgroup.org
        extraEnv:
          - name: INARI_AGENT_GATEWAY_ADDRESS
            value: "https://inari-gw.7kgroup.org"
          - name: INARI_AGENT_IMAGE_REPO
            value: "ghcr.io/7k-inari/inari-agent"
  destination:
    server: https://kubernetes.default.svc
    namespace: inari
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
