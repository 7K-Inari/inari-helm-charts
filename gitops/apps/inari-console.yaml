# inari-console — OCI chart released from this repo (charts/inari-console,
# moved back from the inari-ui repo) into the org-level OCI namespace.
# targetRevision pins the first centrally-released chart version; stays
# OutOfSync until that release is published.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inari-console
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: inari
  source:
    repoURL: ghcr.io/7k-inari/charts
    chart: inari-console
    targetRevision: 0.4.0
    helm:
      releaseName: inari-console
      values: |
        keycloakUrl: http://keycloak.local:8080
        keycloakRealm: inari
        keycloakClientId: inari-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: inari
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
