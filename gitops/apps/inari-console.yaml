# inari-console — OCI chart released from the inari-ui repo (chart moved out
# of this repo; publishes flip the GHCR package to public so this pulls
# anonymously).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inari-console
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: inari
  source:
    repoURL: ghcr.io/7k-inari/inari-ui/charts
    chart: inari-console
    targetRevision: 0.3.0
    helm:
      releaseName: inari-console
      values: |
        keycloakUrl: http://keycloak.local:8080
        keycloakRealm: inari
        keycloakClientId: inari-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: inari
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
