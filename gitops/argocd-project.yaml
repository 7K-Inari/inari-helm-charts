# AppProject for the Inari platform stack.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: inari
  namespace: argocd
spec:
  description: Inari platform (GitOps-composed control plane)
  sourceRepos:
    - "ghcr.io/7k-inari/*"
    - "https://cloudnative-pg.github.io/charts"
    - "https://nats-io.github.io/k8s/helm/charts/"
    - "https://openfga.github.io/helm-charts"
    - "https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/*"
    - "https://github.com/7K-Inari/inari-helm-charts.git"
  destinations:
    - server: "https://kubernetes.default.svc"
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
